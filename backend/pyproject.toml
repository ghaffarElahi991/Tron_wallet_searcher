[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tronforge-api"
version = "0.1.0"
description = "FastAPI control plane for on-demand TRON vanity-wallet generation"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.30,<4",
  "alembic>=1.14,<2",
  "anyio>=4.8,<4.15",
  "coincurve>=20,<22",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pycryptodome>=3.20,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.46,<1",
  "tronpy>=0.6.2,<0.7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
tronforge-generator = "app.generator.__main__:main"
tronforge-funding = "app.funding.__main__:main"
tronforge-telegram = "app.telegram_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
